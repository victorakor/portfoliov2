<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Manage — Victor Akor Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><a href="/admin">Victor<span>.</span> Admin</a></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Overview</div>
      <a href="/admin" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
      <div class="sidebar-section">CRM</div>
      <a href="/admin/leads" class="sidebar-link"><span class="icon">👥</span> Leads</a>
      <a href="/admin/email" class="sidebar-link"><span class="icon">✉️</span> Email Center</a>
      <div class="sidebar-section">Content</div>
      <a href="/admin/blog" class="sidebar-link"><span class="icon">📝</span> Blog Posts</a>
      <a href="/admin/projects" class="sidebar-link"><span class="icon">🗂️</span> Projects</a>
      <div class="sidebar-section">Insights</div>
      <a href="/admin/analytics" class="sidebar-link"><span class="icon">📈</span> Analytics</a>
    </nav>
    <div class="sidebar-footer"><a href="/admin/logout" class="sidebar-link"><span class="icon">🚪</span> Logout</a></div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 class="admin-topbar-title">Blog Manage</h1>
      <div class="admin-topbar-actions">
        <a href="/" target="_blank" class="btn btn-secondary btn-sm">View Site</a>
      </div>
    </div>
    <div class="admin-content">
      <div class="table-wrapper">
        <div class="table-header">
          <h2 class="table-title">Blog Manage</h2>
          <button class="btn btn-primary btn-sm" onclick="openPostModal()">+ New</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="blogTableBody"><tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="postModal">
  <div class="modal" style="max-height:90vh;overflow-y:auto">
    <h2 class="modal-title" id="postModalTitle">New Post</h2>
    <input type="hidden" id="postId" />
    <div class="form-group"><label>Title</label><input type="text" id="postTitle" placeholder="Enter title..." /></div>
    <div class="form-group"><label>Category</label><input type="text" id="postCategory" placeholder="e.g. Engineering" /></div>
    <div class="form-group"><label>Excerpt</label><textarea id="postExcerpt" rows="2" placeholder="Short summary shown in listings..."></textarea></div>
    <div class="form-group">
      <label>Cover image</label>
      <input type="file" id="postCoverFile" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewLocal(this,'postCoverPreview')" />
      <input type="hidden" id="postCoverUrl" />
      <img id="postCoverPreview" alt="" style="display:none;margin-top:12px;max-width:100%;max-height:160px;border-radius:8px" />
    </div>
    <div class="form-group"><label>Content</label><textarea class="editor-area" id="postContent" rows="8" placeholder="Write content..."></textarea></div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="postPublished" style="width:auto;margin:0" /> Published
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('postModal')">Cancel</button>
      <button class="btn btn-primary" id="postSaveBtn" onclick="savePost()">Save</button>
    </div>
  </div>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
