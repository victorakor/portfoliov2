<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Victor Akor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>Victor<span style="color:var(--primary)">.</span></h1>
      <p>Admin Dashboard</p>
    </div>
    <div id="loginAlert" class="alert alert-error" style="display:none"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
        Sign In →
      </button>
    </form>
    <p style="text-align:center;margin-top:24px;font-size:0.8rem">
      <a href="/" style="color:var(--muted)">← Back to Portfolio</a>
    </p>
  </div>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
